name: Quality harness

on:
  pull_request:
  push:
    branches: [main, develop, "remediation/**"]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Quality command matrix
        run: npm run ci
        continue-on-error: true

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: artifacts/verification/**
          if-no-files-found: warn

      - name: Refuse production deploy
        run: echo "This workflow must not deploy. Deploy workflows remain unchanged until Phase 9."
